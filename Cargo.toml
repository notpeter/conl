[package]
name = "conl"
version = "1.6.1"

edition = "2021"
license = "MIT"
description = "CONL is a post-modern configuration language"
repository = "https://github.com/ConradIrwin/conl"

[dependencies]
serde = { version = "1.0", optional = true, features = ["derive"] }

[features]
default = []
serde = ["dep:serde"]
